---
name: Compatibility and Coverage Tests

on:
  push: # Run on every Push
  pull_request: # Run on every PR

permissions: read-all

jobs:
  compatibility-tests:
    name: Compatibility with Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.14"]

    env:
      NOXSESSION: test-and-coverage
      FORCE_COLOR: "1"
      PRE_COMMIT_COLOR: "always"

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit # Monitor outbound connections

      - name: Check out the repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Ensure Poetry cache directory exists
        run: mkdir -p ~/.cache/pypoetry

      - name: Cache pip
        id: cache-pip
        uses: actions/cache@2c8a9bd7457de244a408f35966fab2fb45fda9c8 # v6.0.0
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ matrix.python-version }}-${{ hashFiles('**/pyproject.toml', '**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-${{ matrix.python-version }}-
            ${{ runner.os }}-pip-

      - name: Cache Poetry
        id: cache-poetry
        uses: actions/cache@2c8a9bd7457de244a408f35966fab2fb45fda9c8 # v6.0.0
        with:
          path: ~/.cache/pypoetry
          key: ${{ runner.os }}-poetry-${{ matrix.python-version }}-${{ hashFiles('**/poetry.lock') }}
          restore-keys: |
            ${{ runner.os }}-pip-${{ matrix.python-version }}-
            ${{ runner.os }}-poetry-

      - name: Set up the environment
        uses: ./.github/actions/setup-poetry-env
        with:
          python-version: ${{ matrix.python-version }}
          nox: true

      - name: Run Nox
        run: |
          nox -s test-${{ matrix.python-version }}

      - name: Debug coverage files
        run: |
          echo "Searching for coverage files..."
          find . -name ".coverage*" || true

      # IDEs may warn about env.PYTHON_VERSION might be invalid,
      # but it is a valid environment variable and set at runtime.
      - name: Upload coverage data
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-data${{ env.PYTHON_VERSION }}
          path: ".coverage.*"
          include-hidden-files: true
          compression-level: 9

  coverage:
    name: Produce coverage report
    runs-on: ubuntu-latest
    needs: compatibility-tests
    permissions:
      id-token: write
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit # Monitor outbound connections

      - name: Check out the repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Set up the environment
        uses: ./.github/actions/setup-poetry-env
        with:
          coverage: true
          nox: true

      - name: Download coverage data
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: coverage-*
          path: coverage-artifacts

      - name: Combine coverage data and report
        run: |
          ls -R coverage-artifacts || true
          coverage combine coverage-artifacts || coverage combine
          coverage report
          coverage xml

      - name: Upload coverage report To Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          # Disable search for coverage files.
          # This is helpful when specifying what files you want to upload with the files option.
          disable_search: true
          # On error, exit with non-zero code
          fail_ci_if_error: true
          # Comma-separated explicit list of files to upload.
          # These will be added to the coverage files found for upload.
          # If you wish to only upload the specified files,
          # please consider using "disable-search" to disable uploading other files.
          files: ./coverage.xml
          # Use OIDC instead of token. This will ignore any token supplied
          use_oidc: true
          # Enable verbose logging
          verbose: true
