name: Build and Release

on:
  push:
    tags:
      - "v*"
permissions:
  contents: write # Needed to create releases and upload assets

jobs:
  build:
    name: Build executable with PyInstaller
    runs-on: ubuntu-latest

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit # Monitor outbound connections

      - name: Check out the repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up the environment
        uses: ./.github/actions/setup-poetry-env
        with:
          py-installer: true
          upx: true
          install-package: true

      - name: Build single-file executable with PyInstaller (UPX + INFO log)
        run: |
          pyinstaller --onefile \
            --clean \
            --console \
            --noconfirm \
            --log-level INFO \
            --optimize 2 \
            --name server-manager-agent \
            src/server_manager_agent/launcher.py

      - name: Extract version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Package release artifacts
        run: |
          mkdir -p release

          cp dist/server-manager-agent release/

          cd release

          tar -czf "server-manager-agent-linux-x86_64-v${VERSION}.tar.gz" \
            server-manager-agent

          rm server-manager-agent

      - name: Compute SHA256 checksum of the release archive
        run: |
          cd release
          sha256sum "server-manager-agent-linux-x86_64-v${VERSION}.tar.gz" > "server-manager-agent-linux-x86_64-v${VERSION}.tar.gz.sha256"

      - name: Upload Release Asset
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          files: release/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
