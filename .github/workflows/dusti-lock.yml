---
name: DustiLock Scanner

on:
  push: # Run on every Push
  pull_request:
    # Run on every PR

permissions:
  contents: read

jobs:
  dustilock:
    name: Run DustiLock
    runs-on: ubuntu-latest

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit # Monitor outbound connections

      - name: Checkout the repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Run DustiLock to check for dependency confusion attacks
        uses: checkmarx/dustilock@9a0cc4fe3da93f7efb38679896c074dc94d60ac6 # v1.2.0
        with:
          recursive: true # Scan all subdirectories for lock files
